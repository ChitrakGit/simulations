<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant High-Contrast Cyber Gradient -->
    <linearGradient id="v-inf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="v-inf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070a13" stop-opacity="0" />
    </radialGradient>

    <filter id="v-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Container with Subtle Border -->
  <rect width="64" height="64" rx="14" fill="#070a13" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2" />
  <circle cx="32" cy="32" r="26" fill="url(#v-inf-glow)" />

  <!-- Outer Ambient Glow Track -->
  <path
    d="M 32 32 C 43 23, 49 14, 44 8.5 C 39 3.5, 25 3.5, 20 8.5 C 15 14, 21 23, 32 32 C 43 41, 49 50, 44 55.5 C 39 60.5, 25 60.5, 20 55.5 C 15 50, 21 41, 32 32 Z"
    fill="none"
    stroke="url(#v-inf-grad)"
    stroke-width="7"
    opacity="0.32"
    filter="url(#v-blur)"
  />

  <!-- Main Vertical Infinity Path -->
  <path
    d="M 32 32 C 43 23, 49 14, 44 8.5 C 39 3.5, 25 3.5, 20 8.5 C 15 14, 21 23, 32 32 C 43 41, 49 50, 44 55.5 C 39 60.5, 25 60.5, 20 55.5 C 15 50, 21 41, 32 32 Z"
    fill="none"
    stroke="url(#v-inf-grad)"
    stroke-width="4.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Tech Core Dashed Tracer -->
  <path
    d="M 32 32 C 43 23, 49 14, 44 8.5 C 39 3.5, 25 3.5, 20 8.5 C 15 14, 21 23, 32 32 C 43 41, 49 50, 44 55.5 C 39 60.5, 25 60.5, 20 55.5 C 15 50, 21 41, 32 32 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-dasharray="3 5"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Center Crossing Core Node -->
  <circle cx="32" cy="32" r="3.2" fill="#070a13" stroke="#38bdf8" stroke-width="1.6" />
  <circle cx="32" cy="32" r="1.4" fill="#ffffff" />
</svg>